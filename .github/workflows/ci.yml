# CI ATS v2 (этап D аудита): обязательные проверки каждого push/PR.
#
# Состав:
#  - backend: полный unittest-набор в чистом окружении (sim-провайдер, tmp-БД);
#  - hygiene: синтаксис shell-скриптов, сканер секретов, страха «runtime-данные
#    не в git» (входит в unittest-набор);
#  - frontend: npm ci + сборка + сверка app/ui/build-info.json с исходниками
#    + поведенческий тест логики настроек (node);
#  - audit (не блокирующий, отчёт в лог): pip-audit и npm audit.
#
# Политика merge: тесты/сборка/скан секретов — required, audit — информативный
# (включать блокировку — решение владельца после настройки exemptions).
name: ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: backend (unittest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Полный набор тестов
        run: |
          set -o pipefail
          python3 -m unittest discover -s tests 2>&1 | tee /tmp/test.log
          grep -E "^Ran [0-9]+ tests" /tmp/test.log
          grep -E "^OK( \(skipped=[0-9]+\))?$" /tmp/test.log
      - name: Отчёт при падении (без секретов)
        if: failure()
        run: grep -E "^(FAIL|ERROR):" /tmp/test.log | head -50 || true

  hygiene:
    name: hygiene (shell + секреты)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Синтаксис shell-скриптов
        run: |
          set -e
          while IFS= read -r f; do
            bash -n "$f"
          done < <(git ls-files '*.sh')
      - name: Сканер секретов (рабочее дерево)
        run: python3 tools/secret_scan.py
      - name: Сканер секретов (git-индекс/staged)
        run: python3 tools/secret_scan.py --staged

  frontend:
    name: frontend (build + guard)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: npm ci
        working-directory: frontend
        run: npm ci
      - name: Сборка UI
        working-directory: frontend
        run: npm run build
      - name: Guard: app/ui соответствует исходникам + логика Settings
        run: |
          python3 -m unittest tests.test_ui_build tests.test_settings_save_logic -v
          # build-info.json отличается всегда (builtAt) — сверяем сами ассеты:
          # если sources изменились без пересборки, имена хешей разойдутся
          git diff --exit-code -- app/ui/assets app/ui/index.html || {
            echo "::error::app/ui не соответствует свежей сборке — пересобери и закоммить (см. tests/test_ui_build.py)"; exit 1; }

  dependencies-audit:
    name: dependencies audit (информативно)
    runs-on: ubuntu-latest
    continue-on-error: true   # блокировку включать осознанно (exemptions для PyInstaller и т.п.)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: pip-audit
        run: |
          python3 -m pip install --quiet pip-audit
          pip-audit --strict -r requirements.txt || true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: npm audit (critical)
        working-directory: frontend
        run: npm audit --audit-level=critical || true
