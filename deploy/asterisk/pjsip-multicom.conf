; ============================================================================
;  Мультиком (MCM) — SIP-транк в Asterisk, конфигурация chan_pjsip
;  Это ШАБЛОН: значения из письма оператора подставляет
;      ./deploy/asterisk/install-multicom-trunk.sh
;  (логин/пароль/сервер/порт/кодеки — см. переменные MCM_* в начале скрипта).
;  Файл кладётся в /etc/asterisk/pjsip-multicom.conf, в pjsip.conf:
;      #include pjsip-multicom.conf
;  Можно заполнить и руками: вместо подставленных скриптом меток вписать данные
;  письма (логин/пароль/сервер/порт/сеть), а кодеки поправить прямо в блоке allow=.
; ============================================================================

; --- транспорт: порт 5060/udp наружу, при NAT — обязательны внешние адреса ---
[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060
; Если Asterisk за NAT (в внутренней сети) — укажите публичный IP и свою подсеть:
; external_signaling_address=203.0.113.10
; local_net=10.0.0.0/24

; --- аутентификация на сервере регистрации Мультиком ---
; В chan_pjsip логин Digest-авторизации называется username (auth_type=userpass);
; auth_name был полем объекта auth только в Asterisk 12/13. На 16+ неизвестное поле
; плюс пустой username роняют загрузку объекта (в логе: «mcm-auth: No authentication
; username», main/res_pjsip/config_auth.c), а следом не создаются endpoint и
; registration, которые на него ссылаются. На CLI выглядит так: transport-udp есть,
; а pjsip show endpoints и show registrations — «No objects found».
[mcm-auth]
type=auth
auth_type=userpass
username=__MCM_LOGIN__
; пароль из письма оператора; в файле права 0640, владелец root:asterisk
password=__MCM_PASS__

; --- регистрация у оператора (RE-INVITE раз в 55 с) ---
[mcm-reg]
type=registration
outbound_auth=mcm-auth
server_uri=sip:__MCM_LOGIN__@__MCM_HOST__:__MCM_PORT__
client_uri=sip:__MCM_LOGIN__@__MCM_HOST__:__MCM_PORT__
retry_interval=60
; Повторы после отказа. Дефолты Asterisk 20 (res/res_pjsip/outbound_reg.c):
;   auth_rejection_permanent=yes, forbidden_retry_interval=0, fatal_retry_interval=0,
;   max_retries=10
; При них первый же финальный отказ (401 на REGISTER с подписью, 403) переводит
; регистрацию в Rejected И ОСТАНАВЛИВАЕТ попытки: в логе — «Fatal response '401' received
; from ... stopping outbound registration», а следующая попытка будет только после
; «module reload res_pjsip.so». Транку, который чинят вместе с оператором сутки, нужнее
; стучаться раз в минуту: противоречит «SHOULD NOT» из RFC 3261, но на одном регистраторе
; безопасно. max_retries=0 означает «не повторять вовсе», «бесконечно» не предусмотрено.
auth_rejection_permanent=no
forbidden_retry_interval=60
fatal_retry_interval=60
max_retries=100000
; line_request= — такой опции у объекта registration нет (в вики оператора это из
; chan_sip/старых версий). Asterisk 20 на неизвестном поле категории пишет
; «Could not find option suitable for category 'mcm-reg' named 'line_request'» и
; НЕ создаёт объект целиком — опции после первой ошибки даже не разбираются.
; Нужен статус регистрации в device state endpoint'а — ставят осознанно:
;   line=yes
;   endpoint=mcm

; --- контакт (адрес регистрации) ---
[mcm-aor]
type=aor
max_contacts=1
remove_existing=yes
default_expiration=3600
minimum_expiration=60
; qualify нужен, чтобы при падении регистрации трафик не уходил в пустоту
qualify_frequency=60

; --- endpoint: и для исходящих, и для входящих (identify ниже) ---
[mcm]
type=endpoint
context=from-mcm                       ; входящие с транка → этот контекст (ATS его читает)
disallow=all
;__MCM_ALLOW_BEGIN__
allow=alaw                             ; G.711a — базовый кодек Мультиком
allow=ulaw
allow=g729                             ; если лицензия/модуль codec_g729 установлены
;__MCM_ALLOW_END__
direct_media=no                        ; медиа идёт через Asterisk: запись, озвучка, DTMF
force_rport=yes
rewrite_contact=yes
rtp_symmetric=yes
dtmf_mode=rfc4733                      ; DTMF-события: у Asterisk это rfc4733 (RFC 4733
                                       ; отменил RFC 2833); «rfc2833» — из вики оператора,
                                       ; Asterisk 20 такое значение отвергает, и endpoint
                                       ; не создаётся целиком
from_user=__MCM_LOGIN__
from_domain=__MCM_HOST__
outbound_auth=mcm-auth
aors=mcm-aor
; сколько одновременных каналов отдавать на транк — согласуйте с оператором
device_state_busy_at=__MCM_MAXCH__
language=ru

; --- входящие от оператора без Digest-авторизации: только с их IP ---
[mcm-identify]
type=identify
endpoint=mcm
match=__MCM_HOST__/32
; у Мультиком сигнальные серверы в сети __MCM_NET__ — если входящие «не долетают»,
; добавьте второй identify на всю сеть:
;   [mcm-identify-net]
;   type=identify
;   endpoint=mcm
;   match=__MCM_NET__

; ---------------------------------------------------------------------------
; Имя endpoint'а («mcm») указывается в ATS: Настройки → Asterisk AMI Manager →
; «Имя SIP-транка на операторе». Канал для набора: PJSIP/<номер>@mcm;
; для chan_sip — SIP/mcm/<номер>.
; ---------------------------------------------------------------------------
