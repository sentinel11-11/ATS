; ============================================================================
;  Мультиком (MCM) — SIP-транк в Asterisk, конфигурация chan_pjsip
;  Это ШАБЛОН: значения из письма оператора подставляет
;      ./deploy/asterisk/install-multicom-trunk.sh
;  (логин/пароль/сервер/порт/кодеки — см. переменные MCM_* в начале скрипта).
;  Файл кладётся в /etc/asterisk/pjsip-multicom.conf, в pjsip.conf:
;      #include pjsip-multicom.conf
;  Можно заполнить и руками: вместо подставленных скриптом меток вписать данные
;  письма (логин/пароль/сервер/порт/сеть), а кодеки поправить прямо в блоке allow=.
; ============================================================================

; --- транспорт: порт 5060/udp наружу, при NAT — обязательны внешние адреса ---
[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060
; Если Asterisk за NAT (в внутренней сети) — укажите публичный IP и свою подсеть:
; external_signaling_address=203.0.113.10
; local_net=10.0.0.0/24

; --- аутентификация на сервере регистрации Мультиком ---
[mcm-auth]
type=auth
auth_name=__MCM_LOGIN__
; пароль из письма оператора; в файле права 0640, владелец root:asterisk
password=__MCM_PASS__

; --- регистрация у оператора (RE-INVITE раз в 55 с) ---
[mcm-reg]
type=registration
outbound_auth=mcm-auth
server_uri=sip:__MCM_LOGIN__@__MCM_HOST__:__MCM_PORT__
client_uri=sip:__MCM_LOGIN__@__MCM_HOST__:__MCM_PORT__
retry_interval=60
line_request=registration

; --- контакт (адрес регистрации) ---
[mcm-aor]
type=aor
max_contacts=1
remove_existing=yes
default_expiration=3600
minimum_expiration=60
; qualify нужен, чтобы при падении регистрации трафик не уходил в пустоту
qualify_frequency=60

; --- endpoint: и для исходящих, и для входящих (identify ниже) ---
[mcm]
type=endpoint
context=from-mcm                       ; входящие с транка → этот контекст (ATS его читает)
disallow=all
;__MCM_ALLOW_BEGIN__
allow=alaw                             ; G.711a — базовый кодек Мультиком
allow=ulaw
allow=g729                             ; если лицензия/модуль codec_g729 установлены
;__MCM_ALLOW_END__
direct_media=no                        ; медиа идёт через Asterisk: запись, озвучка, DTMF
force_rport=yes
rewrite_contact=yes
rtp_symmetric=yes
dtmf_mode=rfc2833                      ; как требует оператор
from_user=__MCM_LOGIN__
from_domain=__MCM_HOST__
outbound_auth=mcm-auth
aors=mcm-aor
; сколько одновременных каналов отдавать на транк — согласуйте с оператором
device_state_busy_at=__MCM_MAXCH__
language=ru

; --- входящие от оператора без Digest-авторизации: только с их IP ---
[mcm-identify]
type=identify
endpoint=mcm
match=__MCM_HOST__/32
; у Мультиком сигнальные серверы в сети __MCM_NET__ — если входящие «не долетают»,
; добавьте второй identify на всю сеть:
;   [mcm-identify-net]
;   type=identify
;   endpoint=mcm
;   match=__MCM_NET__

; ---------------------------------------------------------------------------
; Имя endpoint'а («mcm») указывается в ATS: Настройки → Asterisk AMI Manager →
; «Имя SIP-транка на операторе». Канал для набора: PJSIP/<номер>@mcm;
; для chan_sip — SIP/mcm/<номер>.
; ---------------------------------------------------------------------------
