; ============================================================================
;  Мультиком (MCM) — SIP-транк в Asterisk, конфигурация chan_pjsip
;  Файл кладётся в /etc/asterisk/pjsip-multicom.conf, в pjsip.conf:
;      #include pjsip-multicom.conf
;  Значения подставьте из письма оператора (логин/пароль/сервер регистрации).
; ============================================================================

; --- транспорт: порт 5060/udp наружу, при NAT — обязательны внешние адреса ---
[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060
; Если Asterisk за NAT (в внутренней сети) — укажите публичный IP и свою подсеть:
; external_signaling_address=203.0.113.10
; local_net=10.0.0.0/24

; --- аутентификация на сервере регистрации Мультиком ---
[mcm-auth]
type=auth
auth_name=00083819
; пароль из письма оператора (в этом файле права 0640, владелец asterisk:asterisk)
password=ПАРОЛЬ_ИЗ_ПИСЬМА

; --- регистрация у оператора (RE-INVITE раз в 55 с) ---
[mcm-reg]
type=registration
outbound_auth=mcm-auth
server_uri=sip:00083819@95.128.224.47:5060
client_uri=sip:00083819@95.128.224.47:5060
retry_interval=60
line_request=registration

; --- контакт (адрес регистрации) ---
[mcm-aor]
type=aor
max_contacts=1
remove_existing=yes
default_expiration=3600
minimum_expiration=60
; qualify нужен, чтобы при падении регистрации трафик не уходил в пустоту
qualify_frequency=60

; --- endpoint: и для исходящих, и для входящих (identify ниже) ---
[mcm]
type=endpoint
context=from-mcm                      ; входящие с транка → этот контекст (ATS его читает)
disallow=all
allow=alaw                            ; G.711a — базовый кодек Мультиком
allow=ulaw
allow=g729                             ; если лицензия/модуль codec_g729 установлены
direct_media=no                        ; медиа идёт через Asterisk: запись, озвучка, DTMF
force_rport=yes
rewrite_contact=yes
rtp_symmetric=yes
dtmf_mode=rfc2833                      ; как требует оператор
from_user=00083819
from_domain=95.128.224.47
outbound_auth=mcm-auth
aors=mcm-aor
; сколько одновременных каналов отдавать на транк — согласуйте с оператором
device_state_busy_at=15
language=ru

; --- входящие от оператора без Digest-авторизации: только с их IP ---
[mcm-identify]
type=identify
endpoint=mcm
match=95.128.224.47/32
; у Мультиком сигнальные серверы в сети 95.128.224.0/21 — при проблемах
; с входящими добавьте второй identify с match=95.128.224.0/21

; ---------------------------------------------------------------------------
; В ATS (Настройки → Asterisk AMI) указывается имя этого endpoint'а: «mcm».
; Канал для набора собирается как PJSIP/<номер>@mcm; для chan_sip — SIP/mcm/<номер>.
; ---------------------------------------------------------------------------
