; ============================================================================
;  Команда синтеза речи для AGI-скрипта ATS (озвучка сообщений, поток message)
;  Файл: /etc/asterisk/ats-tts.conf   (права 0640, владелец asterisk:asterisk)
;  Плейсхолдеры: {out} — куда положить WAV, {text} — текст (кавычки не нужны).
;  Установить движок:  apt-get install -y espeak-ng    (или festival/saynix/локальный SKU)
; ============================================================================
cmd=/usr/bin/espeak-ng -v ru -s 150 -w {out} {text}
; варианты:
; cmd=/usr/local/bin/my-tts --voice female --out {out} --text {text}
; cmd=/usr/bin/saynix -t {text} -o {out} --lang=ru_RU
; каталог временных файлов (должен быть доступен на запись пользователю asterisk):
tmp_dir=/var/spool/asterisk/ats
