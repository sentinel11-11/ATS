; ============================================================================
;  Мультиком (MCM) — SIP-транк в Asterisk, конфигурация chan_sip
;  Точный формат по документации оператора (их wiki, страница «Asterisk»).
;  Актуально для Asterisk 10–18 с установленным chan_sip; в Asterisk 20+
;  chan_sip считается устаревшим (в 22 удалён) — используйте pjsip-multicom.conf.
;  Файл: /etc/asterisk/sip-multicom.conf, в sip.conf: #include sip-multicom.conf
; ============================================================================
[general]
register => 00083819:ПАРОЛЬ_ИЗ_ПИСЬМА@95.128.224.47:5060
; рекомендации оператора: без этого нет голоса/фразы сотового на выключенных номерах
progressinband=yes
prematuremedia=no

[mcm]
type=peer
host=95.128.224.47
port=5060
dtmfmode=rfc2833
disallow=all
allow=alaw
allow=ulaw
; allow=g729                ; либо другой кодек, указанный в письме
directmedia=no
canreinvite=no
defaultuser=00083819
fromuser=00083819
secret=ПАРОЛЬ_ИЗ_ПИСЬМА
insecure=port,invite       ; входящие от оператора приходят без Digest — только с их IP
qualify=no
context=from-mcm           ; входящие идут в этот контекст (ATS его читает по AMI)
language=ru
; ============================================================================
;  В ATS: Настройки → Asterisk AMI → «Технология канала» = SIP,
;  «Имя SIP-транка» = mcm.  Канал набора: SIP/mcm/8XXXXXXXXXX
; ============================================================================
