; ============================================================================
;  Пользователь Asterisk Manager Interface для ATS
;  1) /etc/asterisk/manager.conf, секция [general]: enabled=yes, webenabled=no
;     (порт 5038 наружу НЕ открывать — ATS обычно на том же хосте)
;  2) в КОНЕЦ manager.conf добавить строку:  #include manager-ats.conf
;  3) chmod 0640, chown asterisk:asterisk;  core reload cfg
;  Пароль сгенерировать:  openssl rand -hex 24
; ============================================================================
[ats]
secret = ЗАМЕНИТЕ_НА_СЛУЧАЙНЫЙ_ПАРОЛЬ
permit = 127.0.0.1/255.255.255.255
; если ATS стоит на отдельной машине — добавьте её внутренний адрес:
; permit = 10.0.0.5/255.255.255.255
; события Newchannel/Dial/Hangup/VarState + команды Originate/Bridge/Hangup
read = all
write = all
writetimeout = 100
