; ============================================================================
;  Диалплан ATS (внешняя АТС) — контексты исходящих, озвучки и входящих
;  Файл: /etc/asterisk/extensions-ats.conf, в extensions.conf:
;      #include extensions-ats.conf
;  Каталоги: запись — /var/spool/asterisk/monitor/ats/, скрипт озвучки —
;      /var/lib/asterisk/agi-bin/ats_say.py (из deploy/asterisk/agi/)
; ============================================================================

[ats-out]
; Сюда кладёт звонок движок ATS: AMI Originate (Exten=s, Context=ats-out).
; Номер уже набран каналом, этот контекст отрабатывает ПОСЛЕ ответа абонента:
; запись + озвучка текста сообщения (поток message) и корректный Hangup.
exten => s,1,NoOp(ATS out: ${CHANNEL} cid=${CALLERID(num)} call=${ATS_CALL_ID})
 same => n,ExecIf($["${ATS_CALL_ID}" = ""]?NoOp(ATS call-id не передан))
 ; CDR/AMApplink: по нему запись ищется в биллинге оператора и в нашей БД
 same => n,ExecIf($["${ATS_CALL_ID}" != ""]?Set(CDR(userfield)=ats-call-${ATS_CALL_ID}))
 ; --- запись разговора (когда в ATS включён флаг записи: ATS_RECORD=1) ---
 same => n,Set(ATS_REC_DIR=/var/spool/asterisk/monitor/ats)
 same => n,ExecIf($["${ATS_RECORD}" = "1"]?MixMonitor(${ATS_REC_DIR}/call-${ATS_CALL_ID}.wav,m))
 ; --- озвучка сообщения: текст пришёл переменной ATS_TEXT_B64 ---
 same => n,ExecIf($["${ATS_TEXT_B64}" = ""]?Wait(0.5))
 same => n,ExecIf($["${ATS_TEXT_B64}" != ""]?AGI(ats_say.py))
 ; честный статус: ATS_PLAY выставлен AGI. Если он пуст — озвучки не было,
 ; движок получит «failed», а не «доставлено».
 same => n,ExecIf($["${ATS_PLAY}" = ""]?Set(ATS_PLAY=failed:AGI не вернул результат))
 same => n,Hangup()

[ats-play]
; Резервный контекст озвучки (settings.ami.play_context): используется, когда
; канал переводят сюда из другой точки диалплана (Redirect/PLAYBACK).
exten => s,1,NoOp(ATS play: ${CHANNEL} call=${ATS_CALL_ID})
 same => n,Answer()
 same => n,ExecIf($["${ATS_RECORD}" = "1"]?MixMonitor(/var/spool/asterisk/monitor/ats/play-${ATS_CALL_ID}.wav,m))
 same => n,AGI(ats_say.py)
 same => n,ExecIf($["${ATS_PLAY}" = ""]?Set(ATS_PLAY=failed:AGI не вернул результат))
 same => n,Hangup()

[from-mcm]
; Входящие с транка Мультиком (context у endpoint'а/peer'а).
; ${EXTEN} — DID (10 цифр, напр. 9690229937), ${CALLERID(num)} — B-номер 10 цифр.
; Движок ATS видит этот канал по AMI (Newchannel в контексте из settings.ami
; «inbound_contexts») и заводит запись в журнале: разговор/пропущенный → amoCRM.
exten => _X.,1,NoOp(ATS in: DID=${EXTEN} from=${CALLERID(num)} chan=${CHANNEL})
 same => n,Set(CHANNEL(language)=ru)
 ; имя файла = имя канала: ATS сопоставит запись со звонком по external_call_id
 same => n,Set(ATS_REC=/var/spool/asterisk/monitor/ats/in-${SUBST(${CHANNEL},/,_,-)}.wav)
 same => n,MixMonitor(${ATS_REC},m)
 ; --- вариант A: параллельный звонок сотрудникам (раздаёт ATS/ACD или Asterisk) ---
 same => n,Dial(PJSIP/101&PJSIP/102,25)
 same => n,GotoIf($["${DB(ats/voicemail)}" = "1"]?vm)
 same => n,Playback(vm-noavail)
 same => n,Hangup()
 same => n(vm),Voicemail(${EXTEN}@default,u)
 same => n,Hangup()
 ; --- вариант B: очередь Asterisk вместо Dial (раскомментируйте) ---
 ; same => n,Queue(ats-in,,,,,Q)
 ; same => n,Hangup()
;
; Если оператор начнёт присылать DID в другом виде (7969…, +7969…, 4951234567) —
; шаблон _X. ловит любые цифры; точечную маршрутизацию по номерам добавьте выше:
;   exten => 9690229937,1,NoOp(номер отдела продаж)
;   exten => 9690229937,n,Goto(from-mcm,sales,1)

[ats-in]
; Технический контекст: если входящие заводятся куда-то ещё, сюда достаточно
; поместить то же самое — ATS считает их по AMI (inbound_contexts=from-mcm,ats-in).
exten => s,1,NoOp(ATS inbound test: ${CALLERID(num)})
 same => n,Answer()
 same => n,Playback(tt-monkeys)
 same => n,Hangup()
